      n,K ate 10^6 -- ZERO violacoes, margem convergindo
      monotonicamente ao valor exato 17/3 (Teorema 5), r_K nunca
      atingindo a* em nenhum dos ~1.500 valores de K testados ate 10^6.
      Veredito SOUND, "ACCEPT for catalogue", unico achado uma
      inconsistencia cosmetica na propria contagem de pontos do
      documento-alvo, sem efeito matematico. Integrado como "Estagio
