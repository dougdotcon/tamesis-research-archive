      Q(n)>=sqrt(pi*n/2)-6 para todo n>=1, via a rota elementar ja
      nomeada (-ln(1-x)<=x/(1-x)), com uma comparacao termo-a-termo sem
      truncamento que evita um trade-off desfavoravel que uma primeira
      tentativa em papel encontrou (descartada, registrada no
      pre-registro). Combinado com Teorema 3 e o Lema 4.1 ja provados
      de Estagio 12, isto eleva o limsup_K M_K/sqrt(K)<=a* ja implicito
      no Estagio 12 a um LIMITE EXATO:
      lim_{K->infinito} M_K/sqrt(K) = a* = sqrt(pi)(1/sqrt(2)-1/2) =
      0,3670872... -- a primeira confirmacao rigorosa de que a
      constante numericamente conjecturada e genuinamente o valor
      assintotico correto, nao apenas um limitante superior sobre ele.
      Peca 2 NAO fechada -- monotonicidade de M_K/sqrt(K) tentada por
      duas rotas (uma recursao exata para Q(n), refutada por
      contraexemplo explicito Q(3)=17/9; um limitante pontual direto,
      que exigiria limitantes de Q(n) e phi_K ambos precisos a
      O(1/sqrt(K)) para todo K finito, mais delicado que a ferramenta
      elementar disponivel) -- relatada honestamente como nao fechada,
      com evidencia numerica exata forte (K ate 3000, nunca atinge a*)
      rotulada heuristica, nao prova. A CONSTANTE EFETIVAMENTE PROVADA
      NA HIPOTESE (U') CONTINUA SENDO a=1+sqrt(pi/2)~=2,2533, NAO a*
      -- a*=lim, nao (ainda) sup, e a hipotese (U') exige um limitante
      UNIFORME em K. Referee hostil re-derivou cada passo algebrico do
      zero (incluindo os dois passos sinalizados como nao verificados
      a mao pela sessao orquestradora -- a decomposicao de epsilon(x)
