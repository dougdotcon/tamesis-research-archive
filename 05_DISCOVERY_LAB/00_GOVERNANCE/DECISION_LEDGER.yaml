      (0,1], D_0(gamma)=(gamma-1)/(2(2-gamma)), via soma de Poisson /
      transformacao theta de Jacobi -- ferramenta nova nesta linhagem).
      Uma segunda derivacao heuristica independente (expansao de
      cumulantes, SS4) do "hard half" E(gamma):=D(gamma)-D_0(gamma)
      casa exatamente, simbolicamente, com a forma racional ja
      conjecturada pela onda 17 -- evidencia forte, nao prova. Tres
      lacunas tecnicas nomeadas com precisao em SS5, nenhuma exigindo
      nova citacao externa. Referee hostil dedicado, sem ler nenhum
      script da frente: confirmou o Lema E por duas rotas algebricas
      independentes (nenhum erro); re-derivou D_0(gamma) por um metodo
      distinto ("completar o quadrado antes da soma de Poisson") --
      valor confirmado -- mas encontrou que o termo de erro ENUNCIADO
      no Lema D0, O(sqrt(n)*e^(-cn)) (exponencialmente pequeno), estava
      ERRADO: o erro real e Theta(n^(-1/2)) (polinomialmente pequeno),
      com coeficiente lider explicito (gamma^2*sqrt(pi))/(32*beta^(3/2)),
      derivado independentemente e confirmado numericamente (mpmath, n
      ate 32000, correspondencia a 3-4 digitos significativos) -- ja
      implicitamente visivel nos proprios dados numericos SS3/SS6.1 da
      frente (razao de erros sucessivos -> sqrt(10) sob n->10n) mas
      nunca reconciliado com o enunciado formal do lema. O VALOR de
