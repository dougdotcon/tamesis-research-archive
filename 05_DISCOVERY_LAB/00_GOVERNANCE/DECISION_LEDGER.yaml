  - decision_id: DISC-DEC-056
    date: 2026-08-23
    decision: >
      Integrar o resultado da onda 13, frente (b)
      (`LONG-CYCLE-DEFICIT-ATTEMPT`, DISC-DEC-054), apos verificacao
      adversarial hostil dedicada. Alvo: item 1/SS9 aberto nomeado por
      short_cycle_dynamics_attempt (DISC-DEC-053) -- o plato negativo
      persistente (~-10% a -15%) na populacao de ciclos longos (L>b)
      do M-CLUST(b) -- distinguir se e um vies especifico da estrutura
      de blocos correlacionados (H1) ou um artefato generico de n
      finito, tambem presente em M-U puro sem correlacao de bloco
      (H2). Tres testes pre-registrados: T1 (primario, decisivo) --
      comparacao pareada em (c,n) entre M-CLUST(b) original e M-U puro
      (b=1) em tres celulas; T2 (secundario) -- dose-resposta variando
      b numa celula fixa; T3 (exploratorio) -- teste de um mecanismo
      causal especifico via sub-binagem por L/n. RESULTADO: T1 favorece
      H2 -- o deficit reproduz-se em b=1 (correlacao de bloco ZERO) a
      77-80% da magnitude original em duas das tres celulas (z=-10,21
      e z=-8,04); a terceira celula (alvo) fica ambigua na propria
      execucao da frente (z=-2,39, abaixo da barra pre-registrada), mas
      o referee, com o dobro da amostra, mede z=-3,39, cruzando a
      barra e classificando-a como PRESENT BUT SMALLER -- fortalecendo
      a conclusao pro-H2. T2 e MISTO por sua propria regra numerica
      pre-registrada -- ha uma amplificacao real e reproduzivel
      dependente de b (~1,8-2,6x entre as duas execucoes independentes)
      que fica abaixo do limiar pre-registrado de 3x para H1 "limpo".
      T3 refuta o mecanismo causal especifico proposto (deficit
      crescendo com L/n) sem afetar o veredito H1-vs-H2. VEREDITO
      HONESTO: nem H1 puro nem H2 puro e uniforme -- um piso
      independente de b (H2, dominante, confirmado com z ate -13,9
      pelo referee) mais uma amplificacao secundaria real dependente de
      b (H1, sub-limiar) -- nenhuma forma fechada proposta ou
      garantida pelos testes desta frente. Referee hostil independente
      replicou T0, T1 (N=5000, 2x) e o veredito qualitativo MISTO de T2
      (N=2500, 25% acima) do zero, com sementes frescas e codigo de
      medicao inteiramente proprio (nenhum .py novo desta frente foi
      lido) -- tudo confirmado, nenhum erro que mude qualquer
      conclusao. Dois problemas nomeados: a cifra de referencia da
      celula A (-9,66%) em DERIVATION_PREREG.md estava mal-atribuida
      (celula errada, grandeza errada) -- coincidentemente proxima do
