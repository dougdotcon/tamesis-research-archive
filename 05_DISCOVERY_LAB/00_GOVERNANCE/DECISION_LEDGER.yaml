      (todas as ordens n, nao caso-a-caso) via generalizacao inedita do
      operador de Watson do registro a todas as ordens, provando que a
      y-independencia se propaga automaticamente de cada ordem
      resolvida para a proxima, DADA a validade da contabilidade de
      Watson/Taylor de H1 ate aquela ordem -- verificada mecanicamente
