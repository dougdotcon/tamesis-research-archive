  - id: DISC-DEC-104
    date: 2026-08-27
    decision: >
      Integracao de DISC-SCHUMANN-RESONANCE-001 -- CONCLUIDA. Resultado
      primario: dado real da estacao ELF de Sierra Nevada (Zenodo, 2014,
      3 dias x 2 canais NS/EW, baixado via HTTP Range requests -- apenas
      240,8 MB de 26,7 GB, sem download do arquivo completo, CRC32
      validado automaticamente); taxa de amostragem real lida de 144/144
      arquivos de metadado (256,0164 Hz, nao os 256 Hz nominais); ordem
      de bytes little-endian determinada de forma solida e nao-circular
      via estatisticas de amplitude (saturacao/desvio-padrao). Em 6/6
      pares canal x segmento existe um pico dominante na janela 5-10 Hz
      na localizacao esperada (7,81-8,03 Hz em 5/6, 8,50 Hz no 6o caso),
      mas proeminencia (1,22x-1,44x) abaixo do limiar travado de 3x --
      SUPORTA nao se aplica em nenhum caso. A frente identificou e expos
      honestamente uma ambiguidade textual genuina no proprio
      pre-registro (Secao 5) entre a classificacao NAO DISTINGUE e
      FALSIFICA, sem escolher a leitura mais favoravel. Referee hostil
      dedicado, agente separado, codigo proprio do zero sem ler os
      scripts da frente: reproduziu os 6 casos de forma bit-a-bit
      identica (frequencia, potencia, proeminencia a 3-4 casas decimais);
      adicionou um segundo criterio nao-circular independente para o
      byte order (autocorrelacao lag-1: 0,68-0,84 para little-endian vs.
      ~0,0 para big-endian); confirmou o morro espectral largo como
      feicao real via metodo independente de extrapolacao de fundo em
      lei de potencia (excesso 2,0x-3,2x sobre o fundo suave); re-baixou
      2 arquivos brutos diretamente do Zenodo com implementacao propria,
      confirmando CRC32/SHA256 identicos aos locais; provou
      matematicamente que o unico parametro nao-verificavel (escala
      +-10V, de resumo de artigo pago) e irrelevante ao resultado
      (invariancia de escala confirmada empiricamente); deu seu proprio
      veredito de leitura sobre a ambiguidade textual (pende para NAO
      DISTINGUE, mesma leitura da frente), mas nomeou um problema real de
      desenho do proprio pre-registro -- sob a leitura adotada, o ramo
      FALSIFICA fica quase inatingivel sob medias pesadas de Welch (2698
      segmentos), registrado para julgamento futuro sem reformulacao
      retroativa. Veredito SOUND WITH NAMED ISSUES: 1 achado BAIXA
      (faixa de razao de harmonicos "2-15x" na prosa nao batia com o
      proprio JSON, real 2,31x-18,43x), 1 achado MODERADA (checagem de
      harmonicos usava metodo mais fraco -- bin fixo em vez de busca de
      janela -- que o metodo do pico primario, e nao mencionava uma
      feicao de interferencia de banda estreita mais forte perto de
      15,1-15,2 Hz, nao relacionada a Schumann, fora da banda de busca
      travada e sem efeito no criterio), 1 nota informativa de robustez
      (caso limitrofe unico migra para dentro da banda sob janela
      nao-travada de 32s, reforcando a leitura nao distingue). Todos
