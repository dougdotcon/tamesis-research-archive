  - decision_id: DISC-DEC-085
    date: 2026-08-26
    decision: >
      Integrar o resultado da onda 19, frente (d)
      (`MCLUST-PLATEAU-ABSTRACT-REAL-GAP-ATTEMPT`, DISC-DEC-083), apos
      verificacao adversarial hostil dedicada. Dois objetivos, ambos
      honestos-nao-fechamento-aceitavel. OBJETIVO 1 (gap
      abstrato-vs-real): diagnostico afiado, nao fechado. Usando o valor
      abstrato agora EXATO (Pi(1000)=0,0377615983...) contra as tabelas
      em bin ja vetadas do motor real, o gap composto resolvido por bin
      e media 38,8%, faixa [35,8%,43,2%] -- mais preciso que o "~30%"
      original -- e aproximadamente CONSTANTE em toda a faixa de t0
      (r=0,33), nao concentrado em nenhum regime. Usando um fato
      estrutural das EDPs (s+g conservado em modo G, cresce so em modo
      E) e um argumento de magnitude, a frente enfraquece as duas
      hipoteses nomeadas anteriormente (fronteira s+g<=1; efeito
      finito-n evanescente) como explicacao primaria, sem propor
      substituto. OBJETIVO 2 (quinto termo da ressomacao): confirmacao
      numerica substancialmente fortalecida, ainda CONJECTURADA nao
      derivada. Implementacao fresca da recursao (P,Q) reproduz os 6
      ancoras publicadas exatamente, computa Pi(c) em 11 valores de c
      de 100 a 655360 (range 6553x, alcancando c=100, inacessivel as
      ancestrais), e via metodo de isolamento de residuo obtem
      d4=26,1246 vs conjecturado 209/8=26,125 (~5 digitos, acima dos
      ~2,6 ancestrais) e d5=-82,017 vs conjecturado -82,2353... (~2,6
      digitos, acima de "nao restringido"); re-derivacao simbolica
      confirma a identidade de fechamento R^(n+1)=x*R^(n)+n*R^(n-1) e
      gamma_5=209/24 <=> d4=209/8. H1/H2 permanecem abertos, nao
      tentados. Referee hostil dedicado, sem ler nenhum script da
      linhagem: reproduziu TODOS os 11 valores da grade de Pi(c) da
      frente digito a digito (incluindo Pi(100)); ajuste independente de
      residuo deu d4=26,12464 e d5=-82,01744, batendo a 4e-5/4e-4;
      confirmou a leitura estrutural das EDPs. ENCONTROU DOIS ACHADOS
      NOMEADOS, nenhum afetando numeros reportados: N1 (moderado) --
      o argumento de magnitude testa apenas 3 taxas, nao e exaustivo,
      (c/n)^(1/4) chega mais perto do gap com prefator pequeno (~1,10x),
      candidato nao descartado; N2 (menor, so citacao) -- "3 bins mais a
      direita" deveria ser "os 3 bins que a checagem de robustez de
      cluster ancestral cobriu" (posicoes 5,8,9, nao 7,8,9). Ambos
      corrigidos por adendos datados em ATTEMPT.md. Veredito SOUND WITH
      NAMED ISSUES, "ACCEPT for catalogue" em ambos os tiers exatamente
      reivindicados. Integrado como adendo datado em
      PROOF_DEPENDENCY_MAP.md Arvore B, no PLATRESUM.
