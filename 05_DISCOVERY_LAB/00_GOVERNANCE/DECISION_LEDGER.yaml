  - decision_id: DISC-DEC-024
    date: 2026-08-22
    decision: >
      Integrar a onda 5 completa (DISC-DEC-022): caso K=2 do Lema
      Aberto PROVADO incondicionalmente (verificado por referee
      adversarial sem nenhum erro, que ainda promoveu um item de
      "ajustado" para "provado do zero"); mecanismo com alpha
      intermediario ENCONTRADO e CONFIRMADO, com correcao de
      enquadramento (M-WEIB para beta<1 e membro da familia M-q ja
      classificada, nao um escape dela -- resposta mais forte, nao
      mais fraca). THEOREM.md e MECANISMO_ALPHA_INTERMEDIARIO.md
      corrigidos com adendos datados, textos originais preservados
      intactos.
    rationale: >
      K=2: Lema da Reducao A (geral em K) + analise de casos explicita
      (lema do co-ciclo P=1/2) dao psi_n^(2)=8/15+4/(15n)+1/(15n^2)
      exato, provando phi_n^(2)->phi_2 sem condicionalidade. Referee
      hostil independente verificou em 4 camadas (rederivacao manual,
      forca bruta por caso, ressoma simbolica, forca bruta pura ate
      n=9) -- 0 erros -- e ainda derivou do zero a peca que a tentativa
      original so tinha ajustado por interpolacao, promovendo a taxa
      completa phi_n^(2)=8/15+1/(30n)+7/(10n^2)+1/(5n^3) a provada
      incondicional. Isto resolve honestamente a lacuna 11 do THEOREM.md
      original PARA K=2 (a taxa e Theta(1/n), nao Theta(1/n^2)); K>=3
      permanece aberto, agora um problema estritamente mais estreito.
      Alpha intermediario: M-WEIB(beta) deriva de uma identidade real
      e mais geral do que alegada (H(t)=t*Lambda(t)/c vale para
      qualquer perfil de taxa), mas a verificacao adversarial mostrou
      que, para beta<1 (a regiao que importava), o mecanismo e
      EQUIVALENTE a um membro explicito da familia M-q ja classificada
      (q(t) fechado, permanece em [0,1]) -- a alegacao de "fora de
      M-q" nao se sustenta ai, mas o resultado central (existe um
      mecanismo natural com alpha em (1/2,1)) fica mais forte por
      estar dentro do arcabouço ja provado. Para beta>1, o mecanismo
      genuinamente sai de M-q (q(t) sai de [0,1]), confirmando por
      completo a quebra do piso alpha>=1/2 la fora.
